<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Foodklect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <nav class="navbar bg-white shadow-sm"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><span class="brand-orange">Food</span>klect.</a><a href="menu.html" class="btn btn-outline-dark btn-sm">Menu</a></div></nav>
    <header class="page-hero"><div class="container"><span class="section-label">WE'RE HERE TO HELP</span><h1>Contact us</h1><p>Send a message about your campus food experience.</p></div></header>
    <main class="page-content"><div class="container"><section class="content-card mx-auto" style="max-width:700px"><form id="contactForm"><label for="contactName" class="form-label fw-bold">Name</label><input id="contactName" class="form-control mb-3" required><label for="contactEmail" class="form-label fw-bold">Email</label><input id="contactEmail" type="email" class="form-control mb-3" required><label for="contactSubject" class="form-label fw-bold">Subject</label><input id="contactSubject" class="form-control mb-3" required><label for="contactBody" class="form-label fw-bold">Message</label><textarea id="contactBody" class="form-control" rows="5" required></textarea><button type="submit" class="btn btn-orange rounded-pill px-4 mt-4">Send message</button><div id="contactMessage" class="form-feedback"></div></form></section></div></main>
    <script src="js/storage.js"></script><script src="js/pages.js"></script>
</body>
</html>
