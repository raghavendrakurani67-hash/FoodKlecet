<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Foodklect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .admin-wrap {
            position: relative;
            overflow: hidden;
            padding: 70px 0 100px;
            background:
                radial-gradient(ellipse at 8% 10%, rgba(255, 107, 53, 0.25), transparent 32%),
                radial-gradient(ellipse at 92% 18%, rgba(255, 190, 92, 0.32), transparent 30%),
                radial-gradient(ellipse at 78% 92%, rgba(238, 83, 38, 0.18), transparent 34%),
                linear-gradient(135deg, #fff1e5 0%, #ffe4d5 52%, #fff6ec 100%);
        }

        .admin-wrap::before {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(174, 77, 35, 0.14) 1px, transparent 1px);
            background-size: 24px 24px;
            content: "";
            opacity: 0.32;
            pointer-events: none;
        }

        .admin-wrap > .container {
            position: relative;
            z-index: 1;
        }

        .admin-card {
            background: white;
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 22px;
            box-shadow: 0 18px 50px rgba(115, 59, 33, 0.12);
            padding: 28px;
        }

        .admin-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 26px;
        }

        .admin-topbar h2 {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            margin: 0;
        }

        .admin-form {
            margin-top: 18px;
        }

        .admin-form .form-control,
        .admin-form .form-select {
            border-radius: 10px;
            border: 1px solid #ebdfd8;
            padding: 12px 14px;
            margin-bottom: 16px;
        }

        .admin-form .form-control:focus,
        .admin-form .form-select:focus {
            box-shadow: 0 0 0 3px rgba(255,107,53,0.1);
            border-color: #ff6b35;
        }

        .admin-items-grid {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
        }

        .admin-item-card {
            overflow: hidden;
            border: 1px solid #f0e4dd;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 6px 20px rgba(0,0,0,0.04);
        }

        .admin-item-card img {
            width: 100%;
            height: 165px;
            object-fit: cover;
        }

        .admin-item-card-body {
            padding: 16px;
        }

        .admin-item-card h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 17px;
            font-weight: 700;
            margin: 0 0 5px;
        }

        .admin-item-category {
            color: #777;
            font-size: 12px;
            text-transform: capitalize;
        }

        .admin-item-price {
            font-size: 18px;
            font-weight: 800;
            margin: 12px 0;
        }

        .admin-image-note {
            color: #777;
            font-size: 12px;
            margin: -4px 0 16px;
        }

        .admin-badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge-available {
            background: #eafaf1;
            color: #1f8f57;
        }

        .badge-unavailable {
            background: #ffe9e9;
            color: #d93c3c;
        }

        .admin-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .admin-action {
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .admin-action.edit {
            background: #fff0e8;
            color: #ff6b35;
        }

        .admin-action.delete {
            background: #ffe9e9;
            color: #c62828;
        }

        .status-message {
            display: none;
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .status-message.success {
            display: block;
            background: #e8f7ed;
            color: #218838;
        }

        .status-message.error {
            display: block;
            background: #ffe9e9;
            color: #c62828;
        }

        @media (max-width: 767px) {
            .admin-wrap {
                padding: 38px 0 60px;
            }

            .admin-card {
                padding: 18px;
                border-radius: 18px;
            }

            .admin-topbar {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
            }

            .admin-topbar .text-end {
                text-align: left !important;
            }

            .admin-items-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .admin-action {
                min-height: 44px;
            }
        }
    </style>
</head>
<body data-admin-page="true">
    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <span style="color:#ff6b35;">Food</span>klect
            </a>

            <div class="d-flex align-items-center gap-3">
                <a href="menu.html" class="btn btn-outline-dark btn-sm">Menu</a>
                <button type="button" id="adminLogoutBtn" class="btn btn-orange btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <section class="admin-wrap">
        <div class="container">
            <div class="admin-card">
                <div class="admin-topbar">
                    <div>
                        <span class="section-label">ADMIN PANEL</span>
                        <h2>Manage Menu Items</h2>
                    </div>
                    <div class="text-end">
                        <small class="text-muted">Signed in as:</small>
                        <div id="adminUserEmail" class="fw-bold text-dark">Admin</div>
                    </div>
                </div>

                <form id="adminMenuForm" class="admin-form">
                    <h3 id="adminFormTitle" class="h5 fw-bold mb-3">Add a food item</h3>
                    <input type="hidden" id="menuItemId">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold" for="menuItemName">Item Name</label>
                            <input id="menuItemName" class="form-control" type="text" placeholder="Enter item name" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold" for="menuCategory">Category</label>
                            <select id="menuCategory" class="form-select" required>
                                <option value="snacks">Snacks</option>
                                <option value="meals">Meals</option>
                                <option value="beverages">Beverages</option>
                                <option value="desserts">Desserts</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold" for="menuPrice">Price (₹)</label>
                            <input id="menuPrice" class="form-control" type="number" min="10" step="1" placeholder="99" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold" for="menuAvailability">Availability</label>
                            <select id="menuAvailability" class="form-select">
                                <option value="true">Available</option>
                                <option value="false">Out of Stock</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold" for="menuDescription">Description</label>
                            <textarea id="menuDescription" class="form-control" rows="3" placeholder="Add product details" required></textarea>
                        </div>
                    </div>

                    <p class="admin-image-note">Images are fixed. New items automatically use the selected category's image.</p>

                    <div class="d-flex gap-3 mt-4 flex-wrap">
                        <button type="submit" id="adminSaveButton" class="btn btn-orange px-4">Add Item</button>
                        <button type="button" id="adminResetForm" class="btn btn-outline-dark px-4">Reset</button>
                    </div>
                </form>

                <div id="adminStatusMessage" class="status-message"></div>

                <div id="adminMenuCards" class="admin-items-grid" aria-live="polite"></div>
            </div>
        </div>
    </section>

    <script src="js/storage.js"></script>
    <script src="js/admin-auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
