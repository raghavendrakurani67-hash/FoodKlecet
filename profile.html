<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile | Foodklect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <nav class="navbar bg-white shadow-sm"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><span class="brand-orange">Food</span>klect.</a><div class="d-flex gap-2"><a href="orders.html" class="btn btn-outline-dark btn-sm">My Orders</a><button type="button" id="logoutButton" class="btn btn-orange btn-sm">Logout</button></div></div></nav>
    <header class="page-hero"><div class="container"><span class="section-label">YOUR ACCOUNT</span><h1>My Profile</h1><p>Keep your student contact details up to date.</p></div></header>
    <main class="page-content"><div class="container"><section class="content-card mx-auto" style="max-width:620px"><form id="profileForm"><label for="profileName" class="form-label fw-bold">Full name</label><input id="profileName" class="form-control mb-3" required minlength="2"><label for="profileStudentId" class="form-label fw-bold">Student ID</label><input id="profileStudentId" class="form-control mb-3" disabled><label for="profilePhone" class="form-label fw-bold">Phone</label><input id="profilePhone" class="form-control mb-3" required pattern="[0-9]{10}" maxlength="10"><button class="btn btn-orange rounded-pill px-4" type="submit">Save changes</button><div id="profileMessage" class="form-feedback"></div></form></section></div></main>
    <script src="js/storage.js"></script><script src="js/pages.js"></script>
</body>
</html>
