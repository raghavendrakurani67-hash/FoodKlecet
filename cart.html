<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Cart | Foodklect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <nav class="navbar bg-white shadow-sm"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><span class="brand-orange">Food</span>klect.</a><div class="d-flex gap-3"><a href="menu.html" class="btn btn-outline-dark btn-sm">Menu</a><a href="profile.html" class="btn btn-orange btn-sm">My Account</a></div></div></nav>
    <header class="page-hero"><div class="container"><span class="section-label">YOUR ORDER</span><h1>Your Cart</h1><p>Review your campus favourites before checkout.</p></div></header>
    <main class="page-content"><div class="container"><div id="emptyCart" class="empty-state text-center"><h2>Your cart is empty</h2><p>Add something delicious from the menu.</p><a href="menu.html" class="btn btn-orange rounded-pill px-4">Explore menu</a></div><div id="cartItems" class="cart-list"></div><section id="cartSummary" class="cart-summary content-card" hidden><div><span>Subtotal</span><strong id="cartSubtotal">₹0.00</strong></div><div><span>Pickup</span><strong>Free</strong></div><div class="total"><span>Total</span><strong id="cartTotal">₹0.00</strong></div><a href="checkout.html" class="btn btn-orange rounded-pill px-4 w-100 mt-3">Continue to checkout</a></section></div></main>
    <script src="js/storage.js"></script><script src="js/cart.js"></script>
</body>
</html>
