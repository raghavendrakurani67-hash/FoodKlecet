
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Foodklect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            min-height: 100vh;
            background: #fff8f3;
        }

        .auth-section {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 15px;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            background: #fff;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 12px 45px rgba(0, 0, 0, 0.08);
        }

        .auth-icon {
            width: 65px;
            height: 65px;
            background: #fff0e8;
            color: #ff6b35;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px;
        }

        .auth-card h2 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            color: #777;
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-label {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .auth-input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            outline: none;
            margin-bottom: 20px;
            transition: 0.2s;
        }

        .auth-input:focus {
            border-color: #ff6b35;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .auth-input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 13px;
            border: none;
            background: none;
            color: #777;
            cursor: pointer;
        }

        .auth-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #ff6b35;
            color: white;
            font-weight: 700;
            margin-top: 5px;
            transition: 0.2s;
        }

        .auth-submit:hover {
            background: #e95724;
            transform: translateY(-2px);
        }

        .auth-bottom {
            text-align: center;
            margin-top: 25px;
            color: #777;
        }

        .auth-bottom a {
            color: #ff6b35;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-message {
            display: none;
            padding: 12px;
            border-radius: 9px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .auth-message.error {
            display: block;
            background: #ffe9e9;
            color: #c62828;
        }

        .auth-message.success {
            display: block;
            background: #e8f7ed;
            color: #218838;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <span style="color:#ff6b35;">Food</span>klect
            </a>

            <a href="index.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-house"></i> Home
            </a>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="auth-section">
        <div class="auth-card">

            <div class="auth-icon">
                <i class="bi bi-person"></i>
            </div>

            <h2>Welcome Back!</h2>
            <p class="auth-subtitle">Login to continue ordering your favourite food.</p>

            <div id="loginMessage" class="auth-message"></div>

            <form id="loginForm">

                <label for="studentId" class="auth-label">Student ID</label>
                <input
                    type="text"
                    id="studentId"
                    class="auth-input"
                    placeholder="Enter your student ID"
                    required
                >

                <label for="password" class="auth-label">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        class="auth-input"
                        placeholder="Enter your password"
                        required
                    >

                    <button type="button" class="toggle-password" id="togglePassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>

                <button type="submit" class="auth-submit">
                    Login <i class="bi bi-arrow-right"></i>
                </button>

            </form>

            <div class="auth-bottom">
                <a href="admin-login.html">Admin Login</a>
            </div>

            <div class="auth-bottom">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </div>

        </div>
    </section>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
