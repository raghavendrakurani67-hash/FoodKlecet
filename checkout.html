<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout | Foodklect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <nav class="navbar bg-white shadow-sm"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><span class="brand-orange">Food</span>klect.</a><a href="cart.html" class="btn btn-outline-dark btn-sm">Back to cart</a></div></nav>
    <header class="page-hero"><div class="container"><span class="section-label">ALMOST THERE</span><h1>Checkout</h1><p>Confirm your order details.</p></div></header>
    <main class="page-content"><div class="container"><div class="row g-4"><div class="col-lg-7"><section class="content-card"><h2>Campus pickup</h2><p class="muted-copy">Your order will be ready for collection at the campus canteen counter. No delivery address is needed.</p><form id="checkoutForm"><button type="submit" class="btn btn-orange rounded-pill px-4 mt-3">Place campus pickup order</button><div id="checkoutMessage" class="form-feedback" role="status"></div></form></section></div><div class="col-lg-5"><section class="content-card"><h2>Order summary</h2><pre id="checkoutItems" class="muted-copy" style="white-space:pre-wrap"></pre><hr><div class="d-flex justify-content-between fw-bold"><span>Total</span><span id="checkoutTotal">₹0.00</span></div><div id="paymentQr" class="payment-qr" hidden><h3>Scan to pay</h3><img src="qr-placeholder.svg" alt="Decorative QR placeholder; not a real payment code"><p>This is a demo QR image only. It does not process payments.</p></div></section></div></div></div></main>
    <script src="js/storage.js"></script><script src="js/orders.js"></script>
</body>
</html>
